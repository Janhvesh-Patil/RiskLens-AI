<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiskLens-AI — AI Fraud Detection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
  </head>
  <body>
    <div class="app-shell">
      <!-- Header Section -->
      <header class="app-header">
        <div class="header-content">
          <div class="logo-group">
            <img
              src="assets/logo.png"
              alt="RiskLens-AI — Transaction Risk Analysis"
              class="brand-logo"
            />
          </div>

        </div>
      </header>

      <!-- Main Dashboard Container -->
      <main class="app-container">
        <!-- Control Card: Transaction Selector & Search -->
        <section class="card control-card">
          <div class="control-header">
            <label for="transaction-select" class="control-label">Select or Search Transaction</label>
            <span id="range-hint" class="control-hint">Choose a sample transaction or enter an ID</span>
          </div>
          <div class="control-row">
            <div class="select-wrapper">
              <select id="transaction-select">
                <option value="">Loading sample transactions...</option>
              </select>
              <div class="select-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="m6 9 6 6 6-6"/>
                </svg>
              </div>
            </div>

            <div class="divider-text">OR</div>

            <form id="search-form" class="search-wrapper" onsubmit="return false;">
              <input type="number" id="transaction-search-input" class="search-input" placeholder="Enter ID..." min="0" autocomplete="off" />
            </form>

            <button id="analyze-btn" class="btn-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.3-4.3"/>
              </svg>
              <span>Analyze Risk</span>
            </button>
          </div>
        </section>

        <!-- Two-Column Main Grid -->
        <div class="dashboard-grid">
          <!-- Left Column: Transaction Details -->
          <section class="card panel transaction-panel">
            <div class="panel-header">
              <div class="panel-title-group">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect width="20" height="14" x="2" y="5" rx="2"/>
                  <line x1="2" x2="22" y1="10" y2="10"/>
                </svg>
                <h2>TRANSACTION</h2>
              </div>
              <span class="panel-tag">Input Data</span>
            </div>
            <div class="panel-body">
              <div id="transaction-details">
                <div class="empty-state">
                  <p>Select or search a transaction above to view details.</p>
                </div>
              </div>
            </div>
          </section>

          <!-- Right Column: Risk Assessment -->
          <section class="card panel risk-panel">
            <div class="panel-header">
              <div class="panel-title-group">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                <h2>RISK ASSESSMENT</h2>
              </div>
              <span class="panel-tag">Risk Result</span>
            </div>
            <div class="panel-body">
              <div id="risk-result">
                <div class="empty-state">
                  <p>Click <strong>Analyze Risk</strong> to trigger prediction and SHAP explanation.</p>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
